# Cargo workspace for the Rust port (ADR-088, ADR-093).
#
# Lives at the repo root alongside the Python, deliberately: the two
# implementations must be renderable side by side and diffed against the same
# golden files while the port is in progress. A separate repository would make
# the equivalence check a cross-repo problem exactly when it matters most.
[workspace]
resolver = "3"
members = ["crates/substrate-core", "crates/substrate"]

[workspace.package]
edition = "2024"
rust-version = "1.98"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
# YAML through serde-saphyr: a YAML parser written in SAFE Rust.
#
# Not serde_yaml (archived 2024), and no longer serde_yaml_ng: both sit on
# unsafe-libyaml, a c2rust machine translation of libyaml's C into unsafe Rust
# whose repository was archived in 2024, so bugs found in it are never fixed.
# RUSTSEC-2024-0449 records that, and v0.2.11's first release build stopped at
# the advisory gate on it (2026-10-23). The answer to an unmaintained parser of
# untrusted-ish input is to stop depending on it, not to ignore the advisory.
#
# serde-saphyr has no YAML Value type of its own: untyped YAML is held as
# serde_json::Value. Every YAML call goes through substrate-core's `yaml`
# module, so this choice is made in exactly one place.
serde-saphyr = "2"
serde_json = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
# Only for parsing the JIT grant's RFC3339 expiry. Pinned, pure Rust, no C —
# so it does not threaten the static-musl build the installer depends on.
# Hand-rolling RFC3339 is ~40 lines that get leap years and offsets wrong, to
# save one small dependency on a check whose whole job is a time comparison.
time = { version = "0.3.55", features = ["parsing", "formatting"] }

[profile.release]
# A provisioning tool is not hot; size and a clean backtrace matter more than
# the last few percent of speed.
opt-level = "s"
lto = true
strip = true
