[defaults]
inventory = inventory.py
# Deliberately the built-in `default` callback: the prettier `yaml` callback
# lives in community.general, and pulling in a whole collection dependency for
# cosmetics would add a moving part to something whose entire purpose is
# reproducibility.
stdout_callback = default
# Roles live beside this file, not in /etc/ansible.
roles_path = roles
# The fleet is 5 VMs built sequentially by design (the bootstrap node must be
# up before any join token can be minted), so parallelism buys nothing and
# makes the log harder to follow.
forks = 5
interpreter_python = auto_silent

# Host key checking is deliberately LEFT ON. Ansible only ever connects to the
# two hypervisors, whose keys are stable and known. The k0s nodes are never
# Ansible connection targets — they're addressed through `delegate_to` on their
# hypervisor — so the one place a rebuilt node's changed host key matters is
# the explicit COS_ACTIVE probe, which passes its own scoped
# StrictHostKeyChecking=no. Disabling it globally would trade a real protection
# for convenience we don't need.

[ssh_connection]
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=60s
