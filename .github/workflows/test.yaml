name: test

# Until 2026-08-28 this repo's CI only bumped dependencies — nothing was tested.
# Everything here runs against tests/fixtures/site.yml, never the real one:
# site.yml is gitignored (ADR-012), so a suite that needed it could not run in
# CI at all.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Actions are pinned to a COMMIT SHA, not a tag. A tag is mutable: whoever can
# push to the action's repository can move `v7` to different code, and every
# workflow that trusts the tag runs it on the next build. The trailing comment
# records which release the sha was, so a human can still read the version — and
# `gh api repos/OWNER/REPO/git/ref/tags/TAG` resolves the next one.
#
# This is the same argument as pinning the Kairos image by checksum rather than
# by tag (versions.yml): the tag says what was ASKED for, the digest says what
# will actually run.

permissions:
  contents: read

jobs:
  rust:
    name: rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the pinned toolchain
        # rust-toolchain.toml pins the channel and the musl target. Pinned for
        # the same reason every other version here is: a rebuild months from now
        # must produce the same binary.
        run: rustup show active-toolchain || rustup toolchain install
      - name: rustfmt
        run: cargo fmt --all -- --check
      - name: clippy (warnings are errors)
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Build
        run: cargo build --release
      - name: Static musl binary
        # The assertion lives in check-static-binary.sh so it can be run
        # locally EXACTLY as CI runs it. The inline version of this check was
        # wrong — it grepped `file` output for ldd's wording — and nothing
        # caught it because a step that exists only inside a workflow is never
        # executed anywhere else (ADR-090, third occurrence).
        run: |
          set -euo pipefail
          cargo build --release --target x86_64-unknown-linux-musl
          ./check-static-binary.sh target/x86_64-unknown-linux-musl/release/substrate
      - name: Test — the renderer reproduces every golden
        # The acceptance criterion for Wave 0 of the port. Rust-native: no
        # Python in the loop, because `cargo test` has to stand on its own once
        # Python goes.
        run: cargo test --workspace
      - name: Assert no real site config is committed
        run: |
          if [ -f site.yml ]; then
            echo "::error::site.yml is committed — it must stay gitignored (ADR-012)"
            exit 1
          fi
      - name: Assert the goldens carry no real identity
        # tests/golden/regenerate.py --check did this while Python was the
        # renderer. The goldens are now reproduced by `cargo test` above; this
        # keeps the half of that check that was about DISCLOSURE, not bytes.
        run: |
          set -euo pipefail
          if grep -rnE '192\.168\.|bradpenney|ssh-ed25519 AAAA[^T]' tests/golden/*.yaml; then
            echo "::error::a golden carries a real address, name or key"
            exit 1
          fi
      - name: Test on musl
        # The musl build is what actually ships. Running the suite against it
        # too would catch a renderer that differed by libc — unlikely in pure
        # Rust, and cheap enough to prove rather than assume.
        run: cargo test --workspace --target x86_64-unknown-linux-musl

  shellcheck:
    name: shell
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Lint every shipped script
        # PINNED to a specific shellcheck, run from the same container image used
        # locally. The first version of this step used ubuntu-latest's
        # preinstalled shellcheck and failed on its first run with SC2015 — a
        # check the locally-tested version does not emit AT ALL, even with
        # `-o all`. "Verified clean before gating" was true of a different tool
        # than the gate ran. Pinning makes local and CI the same thing.
        #
        # -S style is the strictest level. These scripts run as root on every
        # hypervisor and drain cluster nodes; an unquoted expansion is not a
        # style opinion.
        run: |
          docker run --rm -v "$PWD:/mnt:ro" -w /mnt \
            koalaman/shellcheck:v0.11.0 -S style *.sh
