name: test

# Until 2026-08-28 this repo's CI only bumped dependencies — nothing was tested.
# Everything here runs against tests/fixtures/site.yml, never the real one:
# site.yml is gitignored (ADR-012), so a suite that needed it could not run in
# CI at all.
on:
  push:
    branches: [main]
    # The badge step commits coverage.svg back to main. A GITHUB_TOKEN push
    # cannot trigger a workflow anyway, but stating it here means the next
    # reader does not have to know that rule to be sure there is no loop.
    paths-ignore: [coverage.svg]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    name: unit & regression
    runs-on: ubuntu-latest
    # The workflow default is `contents: read`; the badge step pushes to the
    # orphan `badges` branch, so this ONE job needs write. Scoped to the job
    # rather than raised workflow-wide: lint, shell and ansible have no reason
    # to be able to write to the repository.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install test dependencies
        # cryptography is imported by create-client-cert.py, which several
        # tests load. Omitting it produced 13 collection errors while the suite
        # itself was fine.
        run: python -m pip install --quiet pytest pytest-cov pyyaml jinja2 cryptography pydantic
      - name: Run the suite
        # No global --cov-fail-under: the gate is PER MODULE, in the next step.
        # A single number over the whole repo hides the thing that matters —
        # the orchestration modules drive real hosts over ssh/kubectl and are
        # covered by `gate.py rebuild`, not by unit tests, so averaging them
        # against the logic modules produces a figure that means nothing.
        # No --cov-config=/dev/null either: that bypassed .coveragerc, which
        # omits tests/. Counting the test files inflated the total from 35% to
        # 54% without covering a line of substrate — a coverage figure is only
        # meaningful against an honest denominator.
        run: |
          python -m pytest tests/ -v \
            --cov --cov-report=term --cov-report=json:coverage.json

      - name: Golden cloud-config is byte-exact and carries no real identity
        # Belt and braces: the goldens are asserted by the suite above, but this
        # step runs the generator's own --check so a CI log shows WHICH archetype
        # drifted and by how much, without anyone re-running pytest locally to
        # find out. It also fails if a golden was captured while the two
        # renderers disagreed (ADR-093).
        #
        # No env block: regenerate.py FORCES the fixture and a fixed key rather
        # than defaulting to them, because a golden rendered from a real
        # site.yml would write real addresses into a committed file. Setting
        # them here would look load-bearing and be ignored.
        run: python3 tests/golden/regenerate.py --check

      - name: Coverage gate (95% per logic module)
        # Per module, not one global number. Driving the orchestration modules
        # to 95% would mean stubbing a hypervisor and asserting the code calls
        # the commands it calls; they are covered by `gate.py rebuild` instead.
        run: python3 .github/scripts/check_coverage.py coverage.json
      - name: Assert no real site config is committed
        # site.yml carries addresses, an admin identity and credentials. The
        # fixture exists so the suite never needs it; this makes that structural
        # rather than a matter of remembering.
        #
        # MUST run BEFORE the badge step. That step switches to the orphan
        # `badges` branch and deletes every file in the working tree, so after
        # it there is no site.yml to find on a main push and this check passes
        # vacuously — it only ever meant anything on pull requests, where the
        # badge step is skipped.
        run: |
          if [ -f site.yml ]; then
            echo "::error::site.yml is committed — it must stay gitignored (ADR-012)"
            exit 1
          fi

      - name: Publish the logic-coverage badge
        # Self-contained on purpose: no Codecov, no third-party upload, no extra
        # token. Coverage data is a map of the codebase, and there is no reason
        # to hand it to a service when a two-colour SVG does the job.
        #
        # COMMITTED TO main AND REFERENCED BY RELATIVE PATH, not pushed to an
        # orphan `badges` branch. The branch version rendered as the plain text
        # "logic coverage" in the README, because this repo is PRIVATE: GitHub's
        # image proxy fetches raw.githubusercontent.com anonymously and gets a
        # 404. A relative path is resolved against the repo itself, so it
        # renders for anyone who can see the repo — private today, public later
        # — with no host that has to be told who we are.
        #
        # Pushing here cannot loop: pushes made with GITHUB_TOKEN do not trigger
        # workflows. The paths-ignore on the push trigger says so explicitly
        # rather than relying on a reader knowing that rule.
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          set -euo pipefail
          # logic-coverage.txt is written by check_coverage.py in the step
          # above. Reading coverage.json's global total here instead published
          # 58% under a badge that says "logic coverage" — the logic figure is
          # 99%. The badge must report the number it is named after.
          PCT=$(cat logic-coverage.txt)
          python3 .github/scripts/make_coverage_badge.py "$PCT" > coverage.svg
          if git diff --quiet -- coverage.svg; then
            echo "coverage badge unchanged at ${PCT}%"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add coverage.svg
          git commit -m "logic coverage: ${PCT}%"
          git push origin HEAD:main

  rust:
    name: rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain
        # rust-toolchain.toml pins the channel and the musl target. Pinned for
        # the same reason every other version here is: a rebuild months from now
        # must produce the same binary.
        run: rustup show active-toolchain || rustup toolchain install
      - name: rustfmt
        run: cargo fmt --all -- --check
      - name: clippy (warnings are errors)
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Build
        run: cargo build --release
      - name: Static musl binary
        # The whole distribution story (ADR-093) rests on this linking
        # statically. Asserting it here rather than trusting the target name:
        # a dynamically linked artifact would still run on the builder and fail
        # on a Kairos node, which is the worst place to find out.
        run: |
          set -euo pipefail
          cargo build --release --target x86_64-unknown-linux-musl
          BIN=target/x86_64-unknown-linux-musl/release/substrate
          file "$BIN" | grep -q "statically linked" || {
            echo "::error::$BIN is not statically linked"; file "$BIN"; exit 1; }
      - name: Test — the renderer reproduces every golden
        # The acceptance criterion for Wave 0 of the port. Rust-native: no
        # Python in the loop, because `cargo test` has to stand on its own once
        # Python goes.
        run: cargo test --workspace
      - name: Test on musl
        # The musl build is what actually ships. Running the suite against it
        # too would catch a renderer that differed by libc — unlikely in pure
        # Rust, and cheap enough to prove rather than assume.
        run: cargo test --workspace --target x86_64-unknown-linux-musl

  lint:
    name: lint & format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install linters and the imports they resolve
        # pylint follows imports, so the runtime dependencies have to be present
        # or it reports import-error for code that is fine.
        run: python -m pip install --quiet pylint pylint-pydantic black pyyaml jinja2 cryptography pydantic

      - name: black
        # --check only: CI reports drift, it does not rewrite the repo. A
        # formatter that edits on the server makes the local copy wrong.
        run: black --check --diff --line-length 88 *.py tests/*.py .github/scripts/*.py

      - name: pylint (10.00/10 required)
        # SOURCE only. Test files legitimately trip pytest idioms — fixtures
        # shadowing names, exercising private helpers — and chasing them would
        # mean weakening the rules that apply to the code that runs in anger.
        # Every disable in .pylintrc is justified in place.
        env:
          SUBSTRATE_SITE_FILE: ${{ github.workspace }}/tests/fixtures/site.yml
          HOMELAB_SSH_PUBLIC_KEY: "ssh-ed25519 AAAATESTKEYONLY ci@fixture"
        run: pylint *.py --fail-under=10

  shellcheck:
    name: shell
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint every shipped script
        # PINNED to a specific shellcheck, run from the same container image used
        # locally. The first version of this step used ubuntu-latest's
        # preinstalled shellcheck and failed on its first run with SC2015 — a
        # check the locally-tested version does not emit AT ALL, even with
        # `-o all`. "Verified clean before gating" was true of a different tool
        # than the gate ran. Pinning makes local and CI the same thing.
        #
        # -S style is the strictest level. These scripts run as root on every
        # hypervisor and drain cluster nodes; an unquoted expansion is not a
        # style opinion.
        run: |
          docker run --rm -v "$PWD:/mnt:ro" -w /mnt \
            koalaman/shellcheck:v0.11.0 -S style *.sh

  ansible:
    name: ansible
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install ansible-core
        # pydantic because inventory.py loads the TYPED site config (ADR-089).
        # Left out, this job fails at import while pytest and lint stay green —
        # the same shape of miss as ADR-090.
        run: python -m pip install --quiet ansible-core pyyaml pydantic
      - name: Inventory resolves and the playbook parses
        # The Ansible path is one of two interchangeable bootstrap
        # implementations (ADR-020). A playbook that no longer parses would be
        # found at rebuild time — 13 minutes in, mid-wipe — rather than here.
        env:
          SUBSTRATE_SITE_FILE: ${{ github.workspace }}/tests/fixtures/site.yml
          # hosts.py resolves the admin SSH key at import time and refuses to
          # guess if it cannot find one. tests/conftest.py sets this for pytest;
          # the ansible job needs the same, and not having it is why this job
          # failed while pytest passed. A dummy is correct here — nothing is
          # provisioned, only parsed.
          HOMELAB_SSH_PUBLIC_KEY: "ssh-ed25519 AAAATESTKEYONLY ci@fixture"
        run: |
          set -euo pipefail
          python3 ansible/inventory.py --list > /dev/null
          ansible-playbook -i ansible/inventory.py ansible/site.yml --syntax-check
