name: test

# Until 2026-08-28 this repo's CI only bumped dependencies — nothing was tested.
# Everything here runs against tests/fixtures/site.yml, never the real one:
# site.yml is gitignored (ADR-012), so a suite that needed it could not run in
# CI at all.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    name: unit & regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install test dependencies
        run: python -m pip install --quiet pytest pyyaml jinja2
      - name: Run the suite
        run: python -m pytest tests/ -v
      - name: Assert no real site config is committed
        # site.yml carries addresses, an admin identity and credentials. The
        # fixture exists so the suite never needs it; this makes that structural
        # rather than a matter of remembering.
        run: |
          if [ -f site.yml ]; then
            echo "::error::site.yml is committed — it must stay gitignored (ADR-012)"
            exit 1
          fi

  shellcheck:
    name: shell
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint every shipped script
        # PINNED to a specific shellcheck, run from the same container image used
        # locally. The first version of this step used ubuntu-latest's
        # preinstalled shellcheck and failed on its first run with SC2015 — a
        # check the locally-tested version does not emit AT ALL, even with
        # `-o all`. "Verified clean before gating" was true of a different tool
        # than the gate ran. Pinning makes local and CI the same thing.
        #
        # -S style is the strictest level. These scripts run as root on every
        # hypervisor and drain cluster nodes; an unquoted expansion is not a
        # style opinion.
        run: |
          docker run --rm -v "$PWD:/mnt:ro" -w /mnt \
            koalaman/shellcheck:v0.11.0 -S style *.sh

  ansible:
    name: ansible
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install ansible-core
        run: python -m pip install --quiet ansible-core pyyaml
      - name: Inventory resolves and the playbook parses
        # The Ansible path is one of two interchangeable bootstrap
        # implementations (ADR-020). A playbook that no longer parses would be
        # found at rebuild time — 13 minutes in, mid-wipe — rather than here.
        env:
          SUBSTRATE_SITE_FILE: ${{ github.workspace }}/tests/fixtures/site.yml
        run: |
          set -euo pipefail
          python3 ansible/inventory.py --list > /dev/null
          ansible-playbook -i ansible/inventory.py ansible/site.yml --syntax-check
