# Pinned, for the same reason every other version in this repo is pinned: a
# rebuild months from now must produce the same binary. The x86_64 musl target
# is what gives a genuinely static executable — no glibc coupling, so one
# artifact runs on Kairos, Fedora and anything else (ADR-093).
[toolchain]
channel = "1.98.0"
targets = ["x86_64-unknown-linux-musl"]
components = ["rustfmt", "clippy"]
