# Pinned upstream component versions — COMMITTED, unlike site.yml.
#
# These are project-wide choices, not site-specific ones, so they live in the
# repo where they are visible to version-control and to the update automation
# in .github/workflows/bump-flux-operator.yaml.
#
# Everything here is PINNED, never "latest": a rebuild months from now must
# install the same thing. The checksum is what actually guarantees that — the
# tag only says what was *asked* for.

flux_operator:
  version: v0.58.1
  sha256: d674546f8cd6c9a09c55a279b119c880ae6d79c726ff7c57ec4d92b26827a04d
  # Where the pinned asset comes from. {version} is substituted.
  url: https://github.com/controlplaneio-fluxcd/flux-operator/releases/download/{version}/install.yaml

# Flux ITSELF is not pinned here — the FluxInstance CR carries a semver RANGE
# and the operator keeps the toolkit current in-cluster. Only the operator
# needs an external bump, which is why only it appears in this file.
flux_distribution:
  version: "2.x"

# The node OS image. PINNED so every node in the fleet is byte-identical and a
# rebuild months from now produces the same nodes.
#
# ⚠️ THIS IS THE NODE PATCHING STORY. The hypervisors get nightly OS updates;
# the nodes are immutable and get NONE. They run whatever image they were built
# from, indefinitely — CVEs included. The only way to patch them is to roll the
# fleet onto a newer image (`gate.py roll`), so letting this pin go stale is a
# standing security gap, not a tidiness issue.
kairos:
  version: v4.2.0
  # The asset name encodes flavour + k0s version, so a bump may change more of
  # this string than just the tag — the bump bot resolves the real asset name
  # from the release rather than guessing.
  iso_url: "https://github.com/kairos-io/kairos/releases/download/v4.2.0/kairos-hadron-v0.5.1-standard-amd64-generic-v4.2.0-k0sv1.36.3%2Bk0s.2.iso"
  iso_sha256: "f59abdafdfca95fd15bd2d92b1bb766f125a92e9b50e7d920c245e31032c3cf3"

# --- observability, host tier (ADR-098) --------------------------------------
#
# These run on the HYPERVISORS as systemd units, not in the cluster, so that the
# metrics store survives a cluster rebuild and can watch one happen. Pinned here
# with the rest for the same reason everything else is: a rebuild months from
# now must install the same bytes, and the checksum is what guarantees that —
# the tag only records what was asked for.
#
# `sha256` is the checksum of the TARBALL, taken from the release's own
# published checksums file, not computed locally from a download that could
# already have been the wrong one.
observability:
  node_exporter:
    version: v1.12.1
    url: https://github.com/prometheus/node_exporter/releases/download/{version}/node_exporter-1.12.1.linux-amd64.tar.gz
    sha256: b51d8a76aa2a9156a55d501aca6276fae09e262259a5e4e831d2c2222f084e63
    # Path of the binary INSIDE the tarball; these three projects each lay it
    # out differently, so it cannot be derived from the name.
    member: node_exporter-1.12.1.linux-amd64/node_exporter
    install_as: node_exporter

  victoria_metrics:
    version: v1.150.0
    url: https://github.com/VictoriaMetrics/VictoriaMetrics/releases/download/{version}/victoria-metrics-linux-amd64-{version}.tar.gz
    sha256: 22bfe77be3de1ad03f214a005129312536d77ed4e293b66c186df417ee40a61d
    member: victoria-metrics-prod
    install_as: victoria-metrics-prod

  victoria_logs:
    version: v1.52.0
    url: https://github.com/VictoriaMetrics/VictoriaLogs/releases/download/{version}/victoria-logs-linux-amd64-{version}.tar.gz
    sha256: d14f585144b8d6813f15e11f0041f487e15e10e5f5e5a31be0311367e93d3494
    member: victoria-logs-prod
    install_as: victoria-logs-prod

  grafana:
    version: v13.2.0
    # NOT a GitHub release asset — Grafana publishes the tarball and its
    # checksum at dl.grafana.com, so that is where both come from. The version
    # appears twice because the tag carries a `v` and the filename does not.
    url: https://dl.grafana.com/oss/release/grafana-13.2.0.linux-amd64.tar.gz
    sha256: 4669384cdb0bb5b4a3f804927e57490d17f4cc47258cd1698fc124e99ee58265
    # A TREE, not a single binary (455 MB: bin/, conf/, public/). Installed by
    # the install_tree path, not install_binary — see ADR-102.
    tree_root: grafana-13.2.0
    install_to: /usr/local/share/grafana
