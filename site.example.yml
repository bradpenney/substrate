# ---------------------------------------------------------------------------
# SITE CONFIGURATION — copy to `site.yml` and edit. `site.yml` is gitignored.
#
#   cp site.example.yml site.yml && $EDITOR site.yml
#
# Everything that identifies a particular installation lives here: addresses,
# usernames, storage pool names, hardware layout. The code in this repo is
# deliberately generic so it can be published without handing anyone a map of
# the network it happens to run on.
#
# Both bootstrap implementations read THIS file — provision.py (via
# siteconfig.py) and ansible/inventory.yml. That's intentional: it makes the
# two definitions impossible to drift apart, rather than merely checking that
# they haven't. What stays independent is the part that matters for the
# destroy-and-rebuild gate — the BUILD LOGIC, which is written twice and
# verified to produce byte-identical node configuration.
#
# Addresses below use the TEST-NET-1 range from RFC 5737, reserved for
# documentation, so nothing here is a real host anywhere.
# ---------------------------------------------------------------------------

# The unprivileged admin account created on every node and used to reach the
# hypervisors. Needs passwordless sudo on the hypervisors during a build
# (see temp-sudo.sh, which grants it time-boxed).
admin_user: youruser

network:
  gateway: 192.0.2.1
  dns_servers:
    - 192.0.2.1
    - 8.8.8.8
  # Bridge on each hypervisor that VMs attach to, so nodes get real LAN IPs.
  bridge: br0
  # The VM's NIC name, matched by NAME in systemd-networkd.
  # NEVER match on Type=ether — it also matches the CNI's veth pairs and
  # breaks pod networking completely.
  primary_nic: ens2

# The physical machines that host VMs. Two here, but any number works.
hypervisors:
  # `ssh_target: null` means "this script runs ON that machine".
  host-a:
    ssh_target: null
    # How the OTHER hypervisor reaches this one. Required when ssh_target is
    # null, because "run locally" carries no address a peer could use.
    peer_target: youruser@192.0.2.10
    # libvirt storage pool for VM disks. Genuinely differs per machine —
    # an LVM pool, or the stock dir pool when there's no LVM.
    disk_pool: default
    # true when the pool's backing filesystem is btrfs: VM images on a
    # copy-on-write filesystem fragment badly, so the pool directory needs
    # `chattr +C` BEFORE any image is created.
    pool_needs_nocow: true
  host-b:
    ssh_target: youruser@192.0.2.11
    disk_pool: vmpool
    pool_needs_nocow: false

# Every node is a combined k0s controller+worker — deliberate for small-cluster
# resiliency. Keep the count ODD: etcd needs a majority, so 5 tolerates 2
# failures while 6 tolerates the same 2 and adds split-brain risk.
#
# Exactly ONE node must have `bootstrap: true`. It comes up first and alone;
# every other node joins using a token minted from it. That ordering matters
# only for the initial build — afterwards all nodes are equal.
#
# memory_mib / vcpu are optional per-node overrides; omit them to use the
# defaults below. Sizing per host is the point: machines differ, so uniform
# sizing would waste one and starve the other.
nodes:
  node-1:
    hypervisor: host-b
    ip: 192.0.2.20
    bootstrap: true
  node-2:
    hypervisor: host-b
    ip: 192.0.2.21
  node-3:
    hypervisor: host-a
    ip: 192.0.2.23
    memory_mib: 10240
    vcpu: 4
  node-4:
    hypervisor: host-a
    ip: 192.0.2.24
    memory_mib: 10240
    vcpu: 4
  node-5:
    hypervisor: host-a
    ip: 192.0.2.25
    memory_mib: 10240
    vcpu: 4

defaults:
  memory_mib: 7168
  vcpu: 2          # proven-working; 3 produced an odd 3-socket topology
  disk_gb: 20
  # Dedicated second disk for Longhorn (ADR-050), in GB.
  #
  # 0 = do not attach one, which is the safe default: a node built without it
  # is not silently degraded, Longhorn simply finds no disk to claim. Raise this
  # (and rebuild) when rolling out storage. Per-node overrides are supported —
  # server1's nodes can carry far more than server2's.
  storage_disk_gb: 0


k0s:
  args:
    - "--enable-worker"
    - "--no-taints"
    # Selects the workerProfile of the same name from the rendered k0s.yaml
    # (ADR-064). Without this flag the profile is applied to NOTHING: k0s only
    # reads a worker profile when a worker explicitly asks for it by name, so
    # the reservation would sit in the config looking correct while the
    # scheduler carried on overcommitting the node.
    - "--profile=homelab"
  # Long enough for a full fleet build in one session, short enough that a
  # stale token in an old ISO fails loudly rather than silently working.
  token_expiry: 24h

# --- API server hardening (ADR-066) ---
api_hardening:
  # 32 random bytes, base64. Encrypts Secrets at rest in etcd.
  # Generate with:
  #   python3 -c 'import os,base64;print(base64.b64encode(os.urandom(32)).decode())'
  #
  # ⚠️ THIS KEY IS THE ONLY WAY TO READ YOUR OWN SECRETS. It must be identical
  # on every controller and must survive a rebuild -- lose it and every Secret
  # in an etcd snapshot is unrecoverable ciphertext. site.yml is gitignored and
  # covered by the nightly backup, which is what makes that safe.
  #
  # Rotate by putting a NEW key first in the list and keeping the old one
  # second, then rewriting every Secret so it is re-encrypted under the new key:
  #   kubectl get secrets -A -o json | kubectl replace -f -
  # Only then can the old key be dropped.
  secrets_encryption_key: "REPLACE-ME-32-random-bytes-base64"

  # Audit log destination. "-" means stdout, which journald captures.
  # Deliberately not a file: the nodes run an immutable OS where most of the
  # filesystem is read-only, and a log path that silently fails to write is
  # worse than no audit log at all -- it looks like one.
  audit_log_path: "-"
  audit_log_maxage: "30"

# --- posture check (ADR-073) ---
posture:
  # The public hostname to verify, and the origin address that must REFUSE a
  # direct connection. Both live here rather than in the script because this
  # file is gitignored and `substrate` is a public repository — the WAN address
  # is exactly the kind of detail that should not be published.
  public_hostname: hello.example.com
  origin_ip: ""   # your WAN address; leave empty to skip the origin-lock check

libvirt:
  iso_pool: isos
  iso_pool_path: /var/lib/libvirt/isos

# GitOps bootstrap (ADR-018). Baked into each node via the k0s manifest
# deployer, so a rebuilt cluster self-configures rather than coming back empty.
flux:
  # The OCI artifact holding your cluster config. Flux pulls this; nothing is
  # ever kubectl-applied.
  oci_repository: ghcr.io/youruser/your-config-repo
  oci_tag: main
  # Read-only registry credentials, if the artifact is private. Leave the token
  # empty for a public artifact. This is the one bootstrap credential that
  # cannot be avoided: Flux needs it before External Secrets exists.
  ghcr_username: youruser
  ghcr_token: ""
  # REQUIRED. Flux refuses to reconcile the artifact unless it was signed by
  # this exact identity (ADR-069). There is deliberately no default: `provider:
  # cosign` on its own accepts ANY valid Sigstore signature, including one an
  # attacker made with their own GitHub account, so a default would be a silent
  # downgrade rather than a convenience.
  #
  # Point it at the workflow that publishes YOUR artifact. Write it exactly as
  # it must appear in the rendered yaml — doubled backslashes and all — because
  # it is interpolated verbatim rather than escaped at render time.
  cosign_subject: '^https://github\\.com/youruser/your-config-repo/\\.github/workflows/publish\\.yaml@refs/heads/main$'
  # Optional; defaults to GitHub Actions. Change only for a different OIDC
  # provider.
  # cosign_issuer: '^https://token\\.actions\\.githubusercontent\\.com$'

# Optional, and read by nothing since the Vercel→Cloudflare replication
# finished (ADR-037; its one-shot script is gone with ADR-183). Kept parseable
# so an existing site.yml still loads; safe to delete from yours.
dns:
  domain: example.com

# Host-tier observability (ADR-098). Optional; omit to skip the metrics store.
#
# Runs as systemd units on ONE hypervisor rather than in the cluster, so that it
# survives a cluster rebuild and can observe one happening. node_exporter is
# installed on every hypervisor regardless.
observability:
  # Which hypervisor carries the store and Grafana. Name one from `hypervisors`
  # above — the one with memory to spare.
  host: server1
  # The public name Grafana answers on. Sets Grafana's root_url; without it,
  # Grafana emits redirects to its bind address and login breaks confusingly.
  hostname: observe.example.com
  retention_months: 6
  # Membership of this GitHub org is the dashboard access list. Leave empty to
  # use Grafana's own logins instead.
  #
  # ⚠️ Grafana's `allowed_organizations` is load-bearing: with GitHub auth on and
  # no org set, ANY GitHub account can sign in. The deploy refuses that
  # combination rather than rendering it.
  github_org: your-github-org
