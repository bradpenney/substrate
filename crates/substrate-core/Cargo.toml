[package]
name = "substrate-core"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Site configuration and cloud-config rendering for substrate."

[dependencies]
serde.workspace = true
serde-saphyr.workspace = true
serde_json.workspace = true
base64.workspace = true
anyhow.workspace = true
time.workspace = true
p256 = { version = "0.14", features = ["ecdsa", "pkcs8", "pem", "getrandom"] }
x509-cert = { version = "=0.3.0", features = ["builder", "pem"] }
sha2 = { version = "=0.11.1", features = ["oid"] }
tar = "0.4"
flate2 = "1"

[dev-dependencies]
tempfile = "3"
