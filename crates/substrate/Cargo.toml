[package]
name = "substrate"
version = "0.2.3"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Provision and operate the k0s fleet."

[[bin]]
name = "substrate"
path = "src/main.rs"

[dependencies]
substrate-core = { path = "../substrate-core" }
clap.workspace = true
anyhow.workspace = true
# posture-check parses kubectl's JSON. The workspace already pins it for
# substrate-core, so this adds no new dependency to the tree.
serde_json.workspace = true

[dev-dependencies]
serde.workspace = true
serde_yaml_ng.workspace = true
tempfile = "3"
